name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token is what makes OIDC work — it lets the job request a short-lived token from
# GitHub that Azure will trust. packages: write publishes images to GHCR.
#
# No long-lived Azure credential exists anywhere in this repository
# (infra/provision-github-oidc.sh explains why).
permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RESOURCE_GROUP: blueShellRG
  WEB_APP: blueshell-dev-web
  API_APP: blueshell-dev-api

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        # Immutable tag. `latest` cannot be traced back to a commit, which makes
        # "what is actually deployed?" unanswerable during an incident.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR, not Azure Container Registry. GHCR is free for public repositories; ACR
      # Basic is ~$5/month for the same job, which is real money against a $0 target
      # (DECISIONS.md D026).
      - name: Push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # api first. If the API revision is broken, `web` should still be pointing at the
      # previous good API rather than a new web talking to a failed one.
      - name: Deploy api
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ env.API_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY }}/${{ github.repository }}/api:${{ needs.build.outputs.tag }}" \
              --output none

      - name: Deploy web
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ env.WEB_APP }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --image "${{ env.REGISTRY }}/${{ github.repository }}/web:${{ needs.build.outputs.tag }}" \
              --output none

      # Deploying is not the same as working. A revision that starts and then fails its
      # health check is exactly the failure this catches.
      - name: Smoke test
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            FQDN=$(az containerapp show \
              --name "${{ env.WEB_APP }}" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.fqdn -o tsv | tr -d '\r\n')

            echo "web: https://${FQDN}"

            # Generous retries and timeout: both containers scale to zero, so this
            # request pays a cold start (DECISIONS.md D001).
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
                "https://${FQDN}/api/health" || echo "000")
              echo "attempt ${attempt}: ${code}"
              [[ "$code" == "200" ]] && exit 0
              sleep 15
            done

            echo "Smoke test failed — web never returned 200." >&2
            exit 1

      # The security property this architecture depends on, asserted on every deploy
      # rather than trusted (docs/THREAT_MODEL.md boundary 2). A config change that
      # flipped the API to external ingress would otherwise be silent.
      - name: Assert api has no public ingress
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail

            EXTERNAL=$(az containerapp show \
              --name "${{ env.API_APP }}" --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query properties.configuration.ingress.external -o tsv | tr -d '\r\n')

            echo "api ingress.external = ${EXTERNAL}"

            if [[ "$EXTERNAL" != "false" ]]; then
              echo "FATAL: the api is publicly reachable. This is the boundary the whole" >&2
              echo "authorization model depends on — failing the deploy." >&2
              exit 1
            fi
