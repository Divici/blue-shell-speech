name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. This repository is public, so a workflow with write access is a
# workflow an attacker would like to reach (docs/THREAT_MODEL.md boundary 8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  web:
    name: web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Lint before typecheck: the storage rules (no localStorage / sessionStorage for PHI)
      # live here, and a violation should be reported as itself rather than buried behind a
      # type error somewhere else. See CLAUDE.md non-negotiable #4.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: api · build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore

      # Warnings are errors (api/Directory.Build.props). On a system of record for
      # children's clinical data, an outstanding nullable warning is a null-reference bug
      # that has not happened yet.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  containers:
    name: containers · build both images
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only. Publishing happens in the deploy workflow, which is the only place
      # that holds credentials.
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: secrets · scan tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This repository is public. A pushed secret is compromised the moment it lands, and
      # rotation is the only remedy — so the scan runs on history, not just the diff.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
